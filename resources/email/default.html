<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f7fc;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f7fc;">
<tr>
<td align="center" style="padding:24px 12px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background-color:#ffffff;border:1px solid #dbe3f0;border-radius:12px;">
<tr>
<td style="padding:20px 28px;background-color:#1f4ba6;border-radius:12px 12px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:bold;letter-spacing:1px;color:#ffffff;">{{brand}}</td>
</tr>
<tr>
<td style="padding:28px 28px 8px 28px;font-family:Arial,Helvetica,sans-serif;">
<h1 style="margin:0 0 16px 0;font-size:22px;line-height:1.3;color:#0f1b33;">{{title}}</h1>
<div style="font-size:15px;line-height:1.6;color:#2b3a55;">{{content}}</div>
</td>
</tr>
<tr>
<td style="padding:8px 28px 24px 28px;font-family:Arial,Helvetica,sans-serif;">{{action}}</td>
</tr>
<tr>
<td style="padding:16px 28px 24px 28px;border-top:1px solid #e6ecf5;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#6b7a94;">
<div>{{footer}}</div>
<div>{{support}}</div>
</td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
