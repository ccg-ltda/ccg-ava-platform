# Development stack. One command:  docker compose up -d --build
#
# Wiring that defines the architecture (pgsql, redis drivers, s3 disk, service hostnames) is fixed here;
# credentials, ports and names are overridable through environment variables / .env (see .env.example).

x-php: &php
  build:
    context: .
    target: development
  image: ccg-ava-platform:dev
  restart: unless-stopped
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
  environment: &php-env
    APP_NAME: ${APP_NAME:-CCG Ava Platform}
    APP_ENV: local
    APP_DEBUG: "true"
    APP_KEY: ${APP_KEY:?APP_KEY is empty. Copy .env.example to .env and set it (see INFRASTRUCTURE.md)}
    APP_URL: ${APP_URL:-http://localhost:8000}
    LOG_CHANNEL: stderr
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-ccg_ava}
    DB_USERNAME: ${DB_USERNAME:-ccg}
    DB_PASSWORD: ${DB_PASSWORD:-secret}
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    BROADCAST_CONNECTION: reverb
    FILESYSTEM_DISK: s3
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    AWS_BUCKET: ${AWS_BUCKET:-ccg-ava}
    AWS_ENDPOINT: http://minio:9000
    AWS_URL: ${AWS_URL:-http://localhost:9000/ccg-ava}
    AWS_USE_PATH_STYLE_ENDPOINT: "true"
    REVERB_APP_ID: ${REVERB_APP_ID:-ccg-ava}
    REVERB_APP_KEY: ${REVERB_APP_KEY:-ccg-ava-key}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:-ccg-ava-secret}
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: 8080
    REVERB_SCALING_ENABLED: "true"
    PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"

services:
  app:
    <<: *php
    environment:
      <<: *php-env
      COMPOSER_INSTALL: "true"
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}   # development only
    ports:
      - "${APP_PORT:-8000}:80"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s   # first boot runs composer install + migrations

  worker:
    <<: *php
    command: ["php", "artisan", "horizon"]
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q 'is running'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]
    deploy:
      replicas: 1   # must stay at 1: several schedulers would run every job several times
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      # [s] keeps the pattern from matching this very shell command
      test: ["CMD-SHELL", "pgrep -f '[s]chedule:work' >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5

  reverb:
    <<: *php
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${REVERB_PORT:-8080}:8080"
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      interval: 15s
      timeout: 5s
      retries: 5

  node:
    image: node:22-alpine
    working_dir: /var/www/html
    # `npm ci` never rewrites package-lock.json; it only runs when node_modules (a volume) is empty.
    command: sh -c "[ -x node_modules/.bin/vite ] || npm ci; npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports:
      - "${VITE_PORT:-5173}:5173"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ccg_ava}
      POSTGRES_USER: ${DB_USERNAME:-ccg}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_FORWARD_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible storage, local only. Production uses DigitalOcean Spaces (see docker-compose.prod.yml).
  # Note: MinIO no longer publishes images on Docker Hub; bitnamilegacy/minio is a frozen community copy, fine for local use.
  # It has no web console (removed from the community build): use the S3 API on :9000 or `mc`.
  # MINIO_DEFAULT_BUCKETS creates the bucket on first boot ("name:public" makes it publicly readable).
  minio:
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEFAULT_BUCKETS: ${AWS_BUCKET:-ccg-ava}:public
    volumes:
      - minio-data:/bitnami/minio/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  vendor:
  node_modules:
  postgres-data:
  redis-data:
  minio-data:
