# Production base. Build + run:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from development: no bind mounts, no node, no minio (files go to S3 / DigitalOcean Spaces),
# no automatic migrations (run them explicitly: `make prod-migrate`), caches built at boot.
# Every PHP service uses the same image; roles only change the command.
#
# Required variables (set them in the environment or in an env file passed with --env-file):
#   APP_KEY, APP_URL, DB_PASSWORD, REDIS_PASSWORD, AWS_* (Spaces), REVERB_APP_*.
#
# Scaling: `app` and `worker` can run several replicas (`--scale app=3 --scale worker=2`); `proxy` balances `app`.
# `scheduler` must stay at exactly 1 replica.
# If you use managed Postgres / Redis (e.g. DigitalOcean), delete those two services and point DB_HOST / REDIS_HOST at them.

x-php: &php
  build:
    context: .
    target: production
  image: ${APP_IMAGE:-ccg-ava-platform:latest}
  restart: always
  environment: &php-env
    APP_NAME: ${APP_NAME:-CCG Ava Platform}
    APP_ENV: production
    APP_DEBUG: "false"
    APP_KEY: ${APP_KEY:?APP_KEY is required}
    APP_URL: ${APP_URL:?APP_URL is required}
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${LOG_LEVEL:-warning}
    OPTIMIZE: "true"
    # Maintenance mode must be shared between replicas (the default "file" driver is per container).
    APP_MAINTENANCE_DRIVER: cache
    APP_MAINTENANCE_STORE: redis
    # Replicas sit behind the `proxy` service: trust its X-Forwarded-* headers (https URLs, client IP).
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
    RUN_MIGRATIONS: "false"
    DB_CONNECTION: pgsql
    DB_HOST: ${DB_HOST:-postgres}
    DB_PORT: ${DB_PORT:-5432}
    DB_DATABASE: ${DB_DATABASE:-ccg_ava}
    DB_USERNAME: ${DB_USERNAME:-ccg}
    DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    REDIS_CLIENT: phpredis
    REDIS_HOST: ${REDIS_HOST:-redis}
    REDIS_PORT: ${REDIS_PORT:-6379}
    REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
    BROADCAST_CONNECTION: reverb
    FILESYSTEM_DISK: s3
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-nyc3}
    AWS_BUCKET: ${AWS_BUCKET:?AWS_BUCKET is required}
    AWS_ENDPOINT: ${AWS_ENDPOINT:-https://nyc3.digitaloceanspaces.com}
    AWS_URL: ${AWS_URL:-}
    AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-false}
    REVERB_APP_ID: ${REVERB_APP_ID:?REVERB_APP_ID is required}
    REVERB_APP_KEY: ${REVERB_APP_KEY:?REVERB_APP_KEY is required}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:?REVERB_APP_SECRET is required}
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: 8080
    REVERB_SCALING_ENABLED: "true"

services:
  # Public entry point and load balancer: round-robins the `app` replicas (Docker DNS) and forwards websockets to reverb.
  # Replace it with a DigitalOcean Load Balancer / Traefik / Caddy if you prefer; then publish nothing here.
  proxy:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 5

  app:
    <<: *php
    expose:
      - "80"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *php
    command: ["php", "artisan", "horizon"]
    user: www-data
    stop_grace_period: 60s
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q 'is running'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]
    user: www-data
    deploy:
      replicas: 1   # exactly one: several schedulers would run every scheduled job several times
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      # [s] keeps the pattern from matching this very shell command
      test: ["CMD-SHELL", "pgrep -f '[s]chedule:work' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5

  reverb:
    <<: *php
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    user: www-data
    expose:
      - "8080"   # reached through `proxy` (location /app); not published on the host
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      interval: 30s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ccg_ava}
      POSTGRES_USER: ${DB_USERNAME:-ccg}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

volumes:
  postgres-data:
  redis-data:
