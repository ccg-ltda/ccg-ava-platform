# CIDR ranges of an EXTERNAL load balancer / TLS terminator in front of this `proxy` (one `<range> 1;` per line). Included by lb.conf.
# Only a connection that comes from one of these may tell the application the client IP (X-Forwarded-For) and the scheme (X-Forwarded-Proto). Leave it EMPTY when users reach this
# nginx directly: any such header sent by a visitor is then discarded and the application sees the real peer address and the real scheme.
# Example (DigitalOcean / ALB in the same VPC):  10.116.0.0/20 1;
