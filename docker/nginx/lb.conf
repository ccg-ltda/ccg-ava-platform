# Load balancer in front of the scaled `app` replicas (see docker-compose.prod.yml).
# Variables in proxy_pass make nginx re-resolve the service name, so new replicas are picked up.
resolver 127.0.0.11 valid=5s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Is the peer that connected to this nginx an external load balancer we trust? Only then are its X-Forwarded-* headers believed (ranges in trusted-lb.conf, empty by default).
# Without this a visitor could send "X-Forwarded-Proto: https" or a forged X-Forwarded-For straight to this nginx and the application would take them as true.
geo $remote_addr $from_trusted_lb {
    default 0;
    include /etc/nginx/conf.d/trusted-lb.inc;
}

# The scheme: the trusted balancer's when it is one, otherwise what this nginx really received.
map "$from_trusted_lb:$http_x_forwarded_proto" $forwarded_proto {
    default $scheme;
    "~^1:(https?)$" $1;
}

# The client chain: appended to only when it comes from the trusted balancer; otherwise it is the real peer alone (anything the visitor sent is dropped).
map $from_trusted_lb $forwarded_for {
    1       $proxy_add_x_forwarded_for;
    default $remote_addr;
}

server {
    listen 80 default_server;
    client_max_body_size 50m;

    # Reverb websockets
    location /app {
        set $reverb http://reverb:8080;
        proxy_pass $reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
    }

    location / {
        set $upstream http://app:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }
}
